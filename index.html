<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMNotes — Personal Digital Notebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --border-subtle: #e2e8f0;
      --border-hover: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-soft: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    body.dark {
      --bg-page: #090d16;
      --bg-surface: #111827;
      --border-subtle: #1f2937;
      --border-hover: #374151;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-soft: #64748b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --danger: #f87171;
      --danger-hover: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .brand-wrap {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      fill: var(--accent);
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .search-filter-box {
      flex: 1;
      max-width: 580px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.35rem 0.65rem;
      transition: border-color 0.2s ease;
    }

    .search-filter-box:focus-within {
      border-color: var(--accent);
      outline: 2px solid var(--accent-soft);
    }

    .search-icon {
      width: 17px;
      height: 17px;
      fill: var(--text-muted);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.875rem;
      color: var(--text-main);
    }

    .date-filter-input {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      outline: none;
      cursor: pointer;
    }

    .clear-btn {
      background: none;
      border: none;
      font-size: 0.75rem;
      color: var(--text-soft);
      cursor: pointer;
      display: none;
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
    }

    .clear-btn:hover {
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border-color: var(--border-subtle);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--bg-page);
      border-color: var(--border-hover);
    }

    .btn-danger {
      background-color: var(--danger);
      color: #ffffff;
    }

    .btn-danger:hover {
      background-color: var(--danger-hover);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-muted);
      cursor: pointer;
    }

    .icon-btn:hover {
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    main {
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .dashboard-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .stats-row {
      display: flex;
      gap: 1.5rem;
      align-items: baseline;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.825rem;
      color: var(--text-muted);
    }

    .stat-badge strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .db-status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 500;
    }

    .db-status.offline {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    .db-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.25rem;
    }

    .note-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .note-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
    }

    .note-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .note-card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
      word-break: break-word;
    }

    .note-card-date {
      font-size: 0.725rem;
      color: var(--text-muted);
      background: var(--bg-page);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .note-card-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      flex: 1;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-line;
    }

    .note-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.75rem;
      font-size: 0.725rem;
      color: var(--text-soft);
    }

    .card-actions {
      display: flex;
      gap: 0.4rem;
    }

    .card-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0.25rem 0.45rem;
      border-radius: 4px;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .card-btn:hover {
      background: var(--bg-page);
      color: var(--text-main);
    }

    .card-btn.delete:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .empty-state h3 {
      font-size: 1.15rem;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 650px;
      box-shadow: var(--shadow-lg);
      transform: scale(0.96);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      overflow: hidden;
    }

    .modal-backdrop.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      background: var(--bg-page);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-label {
      font-size: 0.775rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-input {
      background: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.8rem;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    .form-textarea {
      min-height: 240px;
      resize: vertical;
      line-height: 1.6;
    }

    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      background: var(--text-main);
      color: var(--bg-surface);
      padding: 0.65rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: slideIn 0.2s ease forwards;
    }

    @keyframes slideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 640px) {
      .header-inner {
        flex-direction: column;
        align-items: stretch;
      }
      .search-filter-box {
        max-width: 100%;
      }
      .header-actions {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="brand-wrap">
        <div class="brand-title">
          <svg class="brand-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          MMNotes
        </div>
        <span class="brand-subtitle">Your personal digital notebook</span>
      </a>

      <div class="search-filter-box">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by content, title, or date (e.g. 2026-09-28)..." />
        <input type="date" id="dateFilter" class="date-filter-input" title="Filter by date" />
        <button id="clearSearchBtn" class="clear-btn" title="Clear search">✕</button>
      </div>

      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn" title="Toggle theme">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
        <button id="newNoteBtn" class="btn btn-primary" type="button">+ New Note</button>
      </div>
    </div>
  </header>

  <main>
    <div class="dashboard-top">
      <div class="stats-row">
        <div class="stat-badge">Total Notes: <strong id="statTotal">0</strong></div>
        <div class="stat-badge">This Month: <strong id="statMonth">0</strong></div>
        <div class="stat-badge">Today: <strong id="statToday">0</strong></div>
      </div>
      <div class="db-status" id="dbStatus">
        <span class="db-dot"></span> <span id="dbStatusText">Ready</span>
      </div>
    </div>

    <div class="note-grid" id="noteGrid"></div>
  </main>

  <!-- Create / Edit Note Modal -->
  <div class="modal-backdrop" id="editorModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="editorModalTitle" style="font-size: 1.1rem; font-weight: 600;">New Note</h3>
        <button class="card-btn" id="closeEditorBtn" style="font-size: 1.1rem;" type="button">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" id="noteTitleInput" class="form-input" placeholder="Give your note a title..." />
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" id="noteDateInput" class="form-input" />
        </div>
        <div class="form-group" style="flex:1;">
          <label class="form-label">Note Content</label>
          <textarea id="noteContentInput" class="form-input form-textarea" placeholder="Start typing your note..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelEditorBtn" type="button">Cancel</button>
        <button class="btn btn-primary" id="saveNoteBtn" type="button">Save Note</button>
      </div>
    </div>
  </div>

  <!-- Note Detail Reading Modal -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal-card">
      <div class="modal-header">
        <div style="display:flex; flex-direction:column; gap:0.2rem;">
          <h3 id="detailTitle" style="font-size: 1.15rem; font-weight: 600;"></h3>
          <span id="detailDate" style="font-size: 0.75rem; color: var(--text-muted);"></span>
        </div>
        <button class="card-btn" id="closeDetailBtn" style="font-size: 1.1rem;" type="button">✕</button>
      </div>
      <div class="modal-body">
        <p id="detailContent" style="white-space: pre-wrap; line-height: 1.6; color: var(--text-main); font-size: 0.95rem;"></p>
      </div>
      <div class="modal-footer" style="justify-content: space-between;">
        <span id="detailUpdated" style="font-size: 0.75rem; color: var(--text-soft); align-self: center;"></span>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-secondary" id="detailEditBtn" type="button">Edit</button>
          <button class="btn btn-danger" id="detailDeleteBtn" type="button">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal-card" style="max-width: 420px;">
      <div class="modal-header">
        <h3 style="font-size: 1.05rem; font-weight: 600; color: var(--danger);">Delete Note?</h3>
        <button class="card-btn" id="closeDeleteBtn" type="button">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.5;">
          Are you sure you want to permanently delete this note? This action cannot be undone.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelDeleteBtn" type="button">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn" type="button">Delete Permanently</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Supabase Direct REST API (Zero external script dependencies)
    const SUPABASE_URL = "https://yktoyaqijckynlzdeiuq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrdG95YXFpamNreW5semRlaXVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzkzMTksImV4cCI6MjEwNjE1NTMxOX0.2VpawSiOCybMx0PFEwt2XPGM20WtabLUy4dFdJoq0Zs";
    const REST_ENDPOINT = `${SUPABASE_URL}/rest/v1/mmnotes`;

    const HEADERS = {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    };

    const STORAGE_KEY = "mmnotes_data";
    let notes = [];
    let editingNoteId = null;
    let pendingDeleteId = null;

    // Elements
    const noteGrid = document.getElementById("noteGrid");
    const searchInput = document.getElementById("searchInput");
    const dateFilter = document.getElementById("dateFilter");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const editorModal = document.getElementById("editorModal");
    const detailModal = document.getElementById("detailModal");
    const deleteModal = document.getElementById("deleteModal");
    const noteTitleInput = document.getElementById("noteTitleInput");
    const noteDateInput = document.getElementById("noteDateInput");
    const noteContentInput = document.getElementById("noteContentInput");
    const dbStatus = document.getElementById("dbStatus");
    const dbStatusText = document.getElementById("dbStatusText");

    function updateDbStatus(online, text) {
      dbStatus.className = `db-status ${online ? "" : "offline"}`;
      dbStatusText.textContent = text;
    }

    function readLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function writeLocal(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    // Modal Operations
    function openNewModal() {
      editingNoteId = null;
      document.getElementById("editorModalTitle").textContent = "New Note";
      noteTitleInput.value = "";
      noteContentInput.value = "";
      noteDateInput.value = new Date().toISOString().slice(0, 10);
      editorModal.classList.add("active");
      noteTitleInput.focus();
    }

    function closeEditor() {
      editorModal.classList.remove("active");
    }

    window.openEditModal = function(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      editingNoteId = id;
      document.getElementById("editorModalTitle").textContent = "Edit Note";
      noteTitleInput.value = note.title;
      noteContentInput.value = note.content;
      noteDateInput.value = note.date;
      detailModal.classList.remove("active");
      editorModal.classList.add("active");
    };

    window.openDetailModal = function(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      document.getElementById("detailTitle").textContent = note.title || "Untitled";
      document.getElementById("detailDate").textContent = "Date: " + note.date;
      document.getElementById("detailContent").textContent = note.content;
      document.getElementById("detailUpdated").textContent = "Last updated " + timeAgo(new Date(note.updatedAt || Date.now()));
      
      document.getElementById("detailEditBtn").onclick = () => openEditModal(note.id);
      document.getElementById("detailDeleteBtn").onclick = () => confirmDelete(note.id);
      detailModal.classList.add("active");
    };

    window.confirmDelete = function(id) {
      pendingDeleteId = id;
      detailModal.classList.remove("active");
      deleteModal.classList.add("active");
    };

    // REST Sync Functions
    async function loadCloudNotes() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const res = await fetch(`${REST_ENDPOINT}?select=*&order=updated_at.desc`, {
          headers: HEADERS,
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            notes = data.map(item => ({
              id: item.id,
              title: item.title,
              content: item.content,
              date: item.date,
              createdAt: item.created_at,
              updatedAt: item.updated_at
            }));
            writeLocal(notes);
            updateDbStatus(true, "Cloud Synced");
            renderNotes();
            return;
          }
        }
      } catch (e) {
        console.warn("Using offline storage:", e.message);
      }
      updateDbStatus(false, "Local Mode");
    }

    async function syncUpsert(note) {
      try {
        await fetch(`${REST_ENDPOINT}?on_conflict=id`, {
          method: "POST",
          headers: { ...HEADERS, "Prefer": "resolution=merge-duplicates" },
          body: JSON.stringify({
            id: note.id,
            title: note.title,
            content: note.content,
            date: note.date,
            created_at: note.createdAt,
            updated_at: note.updatedAt
          })
        });
        updateDbStatus(true, "Cloud Synced");
      } catch (err) {
        console.warn("Could not sync to cloud:", err);
      }
    }

    async function syncDelete(id) {
      try {
        await fetch(`${REST_ENDPOINT}?id=eq.${id}`, {
          method: "DELETE",
          headers: HEADERS
        });
      } catch (err) {
        console.warn("Could not delete from cloud:", err);
      }
    }

    function renderNotes() {
      const q = searchInput.value.trim().toLowerCase();
      const d = dateFilter.value;

      const filtered = notes.filter(n => {
        const matchTitle = (n.title || "").toLowerCase().includes(q);
        const matchContent = (n.content || "").toLowerCase().includes(q);
        const matchDate = (n.date || "").includes(q);
        const matchesQuery = !q || matchTitle || matchContent || matchDate;
        const matchesDateFilter = !d || n.date === d;
        return matchesQuery && matchesDateFilter;
      });

      updateStats();

      if (filtered.length === 0) {
        noteGrid.innerHTML = `
          <div class="empty-state">
            <h3>No notes found</h3>
            <p>${notes.length === 0 ? 'Your notebook is empty. Click "+ New Note" to write your first note!' : 'Try adjusting your search terms or date filter.'}</p>
          </div>
        `;
        return;
      }

      noteGrid.innerHTML = filtered.map(note => `
        <div class="note-card" onclick="openDetailModal('${note.id}')">
          <div>
            <div class="note-card-header">
              <span class="note-card-title">${escapeHTML(note.title || "Untitled")}</span>
              <span class="note-card-date">${note.date}</span>
            </div>
            <div class="note-card-preview">${escapeHTML(note.content || "")}</div>
          </div>
          <div class="note-card-footer">
            <span>${timeAgo(new Date(note.updatedAt || Date.now()))}</span>
            <div class="card-actions" onclick="event.stopPropagation();">
              <button class="card-btn" onclick="openEditModal('${note.id}')" type="button">Edit</button>
              <button class="card-btn delete" onclick="confirmDelete('${note.id}')" type="button">Delete</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function updateStats() {
      const now = new Date();
      const currentYearMonth = now.toISOString().slice(0, 7);
      const todayDate = now.toISOString().slice(0, 10);

      document.getElementById("statTotal").textContent = notes.length;
      document.getElementById("statMonth").textContent = notes.filter(n => (n.date || "").startsWith(currentYearMonth)).length;
      document.getElementById("statToday").textContent = notes.filter(n => n.date === todayDate).length;
    }

    async function saveNote() {
      const title = noteTitleInput.value.trim();
      const content = noteContentInput.value.trim();
      const date = noteDateInput.value || new Date().toISOString().slice(0, 10);

      if (!title && !content) {
        showToast("Please enter a title or note content");
        return;
      }

      const timestamp = new Date().toISOString();

      if (editingNoteId) {
        const idx = notes.findIndex(n => n.id === editingNoteId);
        if (idx > -1) {
          notes[idx] = { ...notes[idx], title, content, date, updatedAt: timestamp };
          writeLocal(notes);
          closeEditor();
          renderNotes();
          showToast("Note updated");
          syncUpsert(notes[idx]);
        }
      } else {
        const newNote = {
          id: "note_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7),
          title,
          content,
          date,
          createdAt: timestamp,
          updatedAt: timestamp
        };
        notes.unshift(newNote);
        writeLocal(notes);
        closeEditor();
        renderNotes();
        showToast("Note saved");
        syncUpsert(newNote);
      }
    }

    async function executeDelete() {
      if (!pendingDeleteId) return;
      const id = pendingDeleteId;
      notes = notes.filter(n => n.id !== id);
      writeLocal(notes);
      pendingDeleteId = null;
      deleteModal.classList.remove("active");
      renderNotes();
      showToast("Note deleted");
      syncDelete(id);
    }

    function showToast(msg) {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = msg;
      document.getElementById("toastContainer").appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function timeAgo(date) {
      const s = Math.floor((new Date() - date) / 1000);
      if (s < 60) return "Just now";
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      return `${Math.floor(s / 86400)}d ago`;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // Attach Event Listeners
    document.getElementById("newNoteBtn").addEventListener("click", openNewModal);
    document.getElementById("saveNoteBtn").addEventListener("click", saveNote);
    document.getElementById("closeEditorBtn").addEventListener("click", closeEditor);
    document.getElementById("cancelEditorBtn").addEventListener("click", closeEditor);
    document.getElementById("closeDetailBtn").addEventListener("click", () => detailModal.classList.remove("active"));
    document.getElementById("closeDeleteBtn").addEventListener("click", () => deleteModal.classList.remove("active"));
    document.getElementById("cancelDeleteBtn").addEventListener("click", () => deleteModal.classList.remove("active"));
    document.getElementById("confirmDeleteBtn").addEventListener("click", executeDelete);

    [noteTitleInput, noteDateInput, noteContentInput].forEach(el => {
      el.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") saveNote();
      });
    });

    searchInput.addEventListener("input", () => {
      clearSearchBtn.style.display = searchInput.value ? "block" : "none";
      renderNotes();
    });

    dateFilter.addEventListener("change", renderNotes);

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      dateFilter.value = "";
      clearSearchBtn.style.display = "none";
      renderNotes();
    });

    const themeBtn = document.getElementById("themeToggleBtn");
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("mmnotes_theme", document.body.classList.contains("dark") ? "dark" : "light");
    });

    if (localStorage.getItem("mmnotes_theme") === "dark") {
      document.body.classList.add("dark");
    }

    // Immediate local setup followed by cloud sync
    notes = readLocal();
    renderNotes();
    loadCloudNotes();
  </script>
</body>
</html>
